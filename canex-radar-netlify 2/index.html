<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canex Radar</title>
<style>
  :root{
    --navy: #273278;
    --navy-deep: #171d47;
    --orange: #F39000;
    --red-orange: #E9530D;
    --paper: #F6F5F1;
    --ink: #1B1E2E;
    --slate: #6B7290;
    --line: #DFDFE4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height:100vh;
  }
  .mono{ font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; }

  header{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; padding: 22px 20px 18px; position:relative; overflow:hidden;
  }
  header::before{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 18px 18px; pointer-events:none;
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; flex-wrap:wrap; gap:12px;}
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .name{ font-size:19px; font-weight:700; letter-spacing:0.2px; }
  .brand .tag{ font-size:12.5px; color:#C9CEEE; }
  .mode-toggle{ display:flex; background:rgba(255,255,255,0.1); border-radius:9px; padding:3px; flex-wrap:wrap; }
  .mode-toggle button{
    border:none; background:transparent; color:#D6D9F2;
    padding:8px 14px; font-size:13px; font-weight:600; border-radius:7px; cursor:pointer;
    transition: background .15s, color .15s;
  }
  .mode-toggle button.active{ background:#fff; color:var(--navy-deep); }

  main{ max-width: 1400px; margin: 0 auto; padding: 22px 24px 60px; width:100%; box-sizing:border-box; }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
  .panel + .panel{ margin-top:14px; }
  h2{ font-size:16px; margin:0 0 4px; }
  h3{ font-size:14px; margin:16px 0 8px; color:var(--navy); }
  .hint{ font-size:13px; color:var(--slate); margin:0 0 14px; }

  input[type=text], input[type=password]{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:8px;
    font-size:15px; font-family:inherit; color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--navy); }
  select{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14.5px; font-family:inherit; color:var(--ink); background:#fff;
  }
  textarea{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13.5px; font-family:inherit; color:var(--ink); resize:vertical; min-height:54px;
  }
  label{ display:block; font-size:12px; font-weight:600; color:var(--slate); margin:12px 0 5px; }
  label:first-child{ margin-top:0; }

  .btn{ border:none; border-radius:8px; padding:11px 18px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--orange); color:#1B1200; }
  .btn-primary:hover{ background:#dd8300; }
  .btn-primary:disabled{ opacity:0.6; cursor:default; }
  .btn-ghost{ background:transparent; color:var(--navy); border:1.5px solid var(--navy); }
  .btn-danger{ background:transparent; color:#B3401A; border:1.5px solid #F3C1AC; }
  .btn-full{ width:100%; margin-top:14px; }
  .btn-sm{ padding:7px 12px; font-size:13px; }
  .btn-link{ background:none; border:none; color:var(--navy); font-size:12.5px; font-weight:600; cursor:pointer; padding:2px 0; }

  .error-box{ margin-top:10px; padding:10px 13px; background:#FDEDE7; border:1px solid #F3C1AC; border-radius:8px; color:#8A2E0E; font-size:13px; }
  .status-ok{ font-size:13px; margin-top:10px; color:#1E6B48; }
  .status-err{ font-size:13px; margin-top:10px; color:#B3401A; }

  .sale-card{ border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-top:10px; cursor:pointer; transition: border-color .15s; }
  .sale-card:hover{ border-color:var(--navy); }
  .sale-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .sale-code{ font-size:12px; color:var(--slate); letter-spacing:0.3px;}
  .sale-client{ font-size:15px; font-weight:700; }
  .sale-product{ font-size:12.5px; color:var(--slate); }
  .stage-badge{ display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; background:#FFF1DC; color:#8A5300; white-space:nowrap; }
  .stage-badge.done{ background:#E4F6ED; color:#1E6B48; }
  .vendedor-tag{ font-size:11.5px; color:var(--slate); }

  .mini-track{ display:flex; align-items:center; margin-top:10px; overflow-x:auto; padding-bottom:2px; }
  .mini-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .mini-dot.filled{ background:var(--orange); }
  .mini-dot.current{ background:var(--red-orange); box-shadow:0 0 0 3px rgba(233,83,13,0.18); }
  .mini-line{ width:12px; height:2px; background:var(--line); flex-shrink:0; }
  .mini-line.filled{ background:var(--orange); }

  /* vertical (por defecto: Administración y Vendedor) */
  .flightpath{ margin: 18px 0 4px; }
  .waypoint{ display:flex; gap:14px; position:relative; padding-bottom:20px; }
  .waypoint:last-child{ padding-bottom:0; }
  .wp-rail{ display:flex; flex-direction:column; align-items:center; width:22px; flex-shrink:0; }
  .wp-dot{ width:22px; height:22px; border-radius:50%; border:2.5px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:1; font-size:10.5px; color:var(--slate); }
  .wp-dot.done{ border-color:var(--orange); background:var(--orange); color:#fff; }
  .wp-dot.current{ border-color:var(--red-orange); background:var(--red-orange); color:#fff; box-shadow:0 0 0 4px rgba(233,83,13,0.16); }
  .wp-connector{ width:2px; flex:1; background:var(--line); min-height:16px; }
  .wp-connector.filled{ background:var(--orange); }
  .wp-body{ padding-top:1px; flex:1; min-width:0; }
  .wp-label{ font-size:14px; font-weight:600; }
  .wp-label.future{ color:var(--slate); font-weight:500; }
  .wp-owner{ font-size:11px; color:var(--slate); margin-top:1px; }
  .wp-date{ font-size:11.5px; color:var(--slate); margin-top:2px; }
  .wp-duration-inline{ font-size:11px; color:var(--orange); font-weight:700; margin-top:3px; }
  .wp-choice-badge{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; background:#EEF0FA; color:var(--navy); margin-top:5px; margin-right:5px; }
  .wp-note-preview{ font-size:12px; color:var(--slate); font-style:italic; margin-top:4px; }
  .wp-choice-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
  .choice-btn{ padding:6px 12px; border-radius:14px; border:1.5px solid var(--line); background:#fff; font-size:12.5px; font-weight:600; cursor:pointer; }
  .choice-btn.selected{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .lock-row{ margin-top:8px; text-align:left; }
  .lock-inline{ display:flex; gap:6px; margin-top:6px; align-items:flex-start; flex-wrap:wrap; }
  .lock-inline input{ flex:1; min-width:120px; padding:8px 10px; font-size:13px; }
  .unlocked-box{ margin-top:8px; padding:10px 12px; background:#F9FAFD; border:1px dashed var(--line); border-radius:8px; text-align:left; min-width:210px; }

  /* horizontal (solo vista Cliente) */
  .flightpath.horizontal{ display:flex; align-items:flex-start; overflow-x:auto; margin: 18px -4px 4px; padding:14px 4px 18px; gap:18px; }
  .flightpath.horizontal .waypoint{ display:flex; flex-direction:column; align-items:center; gap:0; min-width:170px; flex:1 0 170px; padding-bottom:0; }
  .flightpath.horizontal .wp-rail{ flex-direction:row; width:100%; }
  .flightpath.horizontal .wp-dot{ width:26px; height:26px; font-size:11px; }
  .flightpath.horizontal .wp-connector{ width:auto; min-width:20px; min-height:0; }
  .flightpath.horizontal .wp-body{ padding-top:10px; text-align:center; padding-left:8px; padding-right:8px; }
  .flightpath.horizontal .wp-duration{ font-size:10.5px; color:var(--orange); font-weight:700; text-align:right; padding-right:8px; margin-top:4px; white-space:nowrap; }

  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-top:14px; font-size:13.5px; }
  .info-grid .k{ color:var(--slate); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; }
  .info-grid .v{ font-weight:600; margin-top:2px; }

  .empty-state{ text-align:center; padding:30px 10px; color:var(--slate); font-size:14px; }
  .close-row{ display:flex; justify-content:flex-start; margin-top:16px; }

  .person-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .person-row:last-child{ border-bottom:none; }
  .person-name{ font-weight:700; font-size:14px; }
  .person-code{ font-size:12.5px; color:var(--slate); }
  .person-actions{ display:flex; gap:6px; flex-shrink:0; }
  .role-group{ margin-top:6px; }
  .edit-row{ padding:10px 0; border-bottom:1px solid var(--line); background:#F9FAFD; margin:0 -20px; padding-left:20px; padding-right:20px; }

  .codes-table{ width:100%; border-collapse:collapse; margin-top:4px; }
  .codes-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--slate); padding:0 10px 8px 0; border-bottom:1.5px solid var(--line); }
  .codes-table td{ padding:12px 10px 12px 0; border-bottom:1px solid var(--line); vertical-align:middle; font-size:14px; }
  .codes-table tr:last-child td{ border-bottom:none; }
  .code-chip{ font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace; font-size:13px; color:#8A2E2E; background:#fff; border:1px solid var(--line); border-radius:6px; padding:3px 10px; display:inline-block; }
  .role-chip{ font-size:12px; color:var(--slate); }

  /* -------- login -------- */
  .login-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:30px 0; }
  .login-card{ background:#fff; border-radius:16px; box-shadow:0 12px 34px rgba(23,29,71,0.10); padding:38px 32px 30px; max-width:400px; width:100%; text-align:center; }
  .login-title{ font-size:18px; font-weight:800; color:var(--ink); margin:4px 0 26px; }
  .login-card label{ text-align:left; }
  .login-caption{ font-size:12.5px; color:var(--slate); margin-top:18px; line-height:1.5; }

  /* -------- hero cliente -------- */
  .client-hero{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 65%, var(--red-orange) 160%);
    border-radius:18px; padding:30px 24px 26px; color:#fff; text-align:center;
    position:relative; overflow:hidden;
  }
  .client-hero::before{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.09) 1.5px, transparent 1.5px);
    background-size: 20px 20px; pointer-events:none;
  }
  .client-hero .drone-emoji{ font-size:40px; line-height:1; position:relative; z-index:1; }
  .client-hero .hero-client{ font-size:13px; color:#C9CEEE; margin-top:8px; position:relative; z-index:1; }
  .client-hero .hero-product{ font-size:22px; font-weight:800; margin-top:2px; position:relative; z-index:1; }
  .client-hero .hero-stage{ font-size:15px; font-weight:600; margin-top:16px; position:relative; z-index:1; }
  .progress-outer{ height:8px; background:rgba(255,255,255,0.18); border-radius:6px; margin-top:16px; overflow:hidden; position:relative; z-index:1; }
  .progress-inner{ height:100%; background:linear-gradient(90deg, var(--orange), var(--red-orange)); border-radius:6px; transition:width .4s ease; }
  .progress-pct{ font-size:11.5px; color:#C9CEEE; margin-top:6px; position:relative; z-index:1; }
  .hero-delivered{ background: linear-gradient(135deg, #1E6B48 0%, var(--navy-deep) 75%); }
  .stage-friendly{ font-size:13px; color:var(--slate); margin:2px 0 0; }
</style>
</head>

<script>
// ============================================================
// Compatibilidad de almacenamiento para despliegue en Netlify.
// Reemplaza window.storage (que solo existe dentro de Claude)
// por llamadas a nuestra propia función serverless, que guarda
// los datos en Netlify Blobs. El resto del código no cambia:
// sigue usando window.storage.get/set/list/delete tal cual.
// ============================================================
if(typeof window.storage === 'undefined'){
  window.storage = {
    async get(key){
      const res = await fetch('/api/storage?action=get&key=' + encodeURIComponent(key));
      if(!res.ok) return null;
      return await res.json(); // { key, value }
    },
    async set(key, value){
      const res = await fetch('/api/storage', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'set', key, value })
      });
      if(!res.ok) return null;
      return await res.json();
    },
    async list(prefix){
      const res = await fetch('/api/storage?action=list&prefix=' + encodeURIComponent(prefix || ''));
      if(!res.ok) return null;
      return await res.json(); // { keys: [...] }
    },
    async delete(key){
      const res = await fetch('/api/storage', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'delete', key })
      });
      if(!res.ok) return null;
      return await res.json();
    }
  };
}

// ---------- storage: ventas ----------
async function loadAllVentas(){
  try{
    const list = await window.storage.list('venta:', true);
    const keys = list && list.keys ? list.keys : [];
    const records = {};
    await Promise.all(keys.map(async (k)=>{
      try{
        const res = await window.storage.get(k, true);
        if(res && res.value){ records[k] = JSON.parse(res.value); }
      }catch(e){ /* skip */ }
    }));
    ventasCache = records;
    return records;
  }catch(e){
    console.error('Error cargando ventas', e);
    return {};
  }
}
async function saveVenta(codigo, record){
  const setRes = await window.storage.set('venta:'+codigo, JSON.stringify(record), true);
  return !!setRes;
}
async function deleteVenta(codigo){
  try{ await window.storage.delete('venta:'+codigo, true); return true; }catch(e){ return false; }
}
function generateCodigo(existingKeys){
  let code, key;
  do{
    const n = Math.floor(1000 + Math.random()*9000);
    code = 'CX-VTA-'+n;
    key = 'venta:'+code;
  }while(existingKeys.includes(key));
  return code;
}

// ---------- storage: códigos generales del sistema ----------
async function loadSystemCodes(){
  try{
    const res = await window.storage.get('sistema:codigos', true);
    if(res && res.value){
      const obj = JSON.parse(res.value);
      COLLAB_CODE = obj.collab || DEFAULT_COLLAB_CODE;
      CONFIG_CODE = obj.config || DEFAULT_CONFIG_CODE;
    }
  }catch(e){
    // no existe aún: se guardarán los valores por defecto la primera vez que se editen
  }
}
async function saveSystemCodes(collab, config){
  const ok = await window.storage.set('sistema:codigos', JSON.stringify({collab, config}), true);
  if(ok){ COLLAB_CODE = collab; CONFIG_CODE = config; }
  return !!ok;
}

        if(res && res.value){ records[k] = JSON.parse(res.value); }

    personalCache = records;
    return records;

    console.error('Error cargando personal', e);
    return {};

// ---------- helpers de render ----------
function stageBadge(idx){
  const done = idx === STAGES.length-1;
  return `<span class="stage-badge ${done?'done':''}">${STAGES[idx].label}</span>`;
}
function miniTrack(idx){
  let html = '<div class="mini-track">';
  STAGES.forEach((s,i)=>{
    const filled = i <= idx;
    const isCurrent = i === idx;
    html += `<div class="mini-dot ${filled?'filled':''} ${isCurrent?'current':''}"></div>`;
    if(i < STAGES.length-1){ html += `<div class="mini-line ${i < idx ? 'filled':''}"></div>`; }
  });
  html += '</div>';
  return html;
}

function formatFecha(iso){
  try{
    const d = new Date(iso);
    const fecha = d.toLocaleDateString('es-EC', {day:'2-digit', month:'short'});
    const hora = d.toLocaleTimeString('es-EC', {hour:'2-digit', minute:'2-digit'});
    return `${fecha} · ${hora}`;
  }catch(e){ return iso; }
}
function formatDuracion(ms){
  if(!isFinite(ms) || ms < 0) ms = 0;
  const totalHoras = Math.floor(ms / 3600000);
  const dias = Math.floor(totalHoras / 24);
  const horas = totalHoras % 24;
  if(dias > 0){ return horas > 0 ? `${dias}d ${horas}h` : `${dias}d`; }
  if(totalHoras > 0){
    const minutos = Math.floor((ms % 3600000) / 60000);
    return minutos > 0 ? `${totalHoras}h ${minutos}m` : `${totalHoras}h`;
  }
  const minutos = Math.max(1, Math.floor(ms / 60000));
  return `${minutos}m`;
}
function fieldDisplayValue(r, idx, f){
  const c = r.campos && r.campos[idx];
  if(!c) return null;
  const val = c[f.key];
  if(!val) return null;
  if(val === 'Otro' && c[f.key+'_otro']) return c[f.key+'_otro'];
  return val;
}
// flightpath de solo lectura (Vendedor / Cliente). showNotes=false oculta las notas internas (uso: vista Cliente).
// horizontal=true dibuja la línea de tiempo en horizontal (uso exclusivo: vista Cliente).
function buildFlightpathReadOnly(r, showNotes, horizontal){
  if(showNotes === undefined) showNotes = true;
  let html = `<div class="flightpath ${horizontal ? 'horizontal' : ''}">`;
  STAGES.forEach((s, i)=>{
    const done = i < r.etapaActual;
    const isCurrent = i === r.etapaActual;
    const fecha = r.fechas && r.fechas[i];
    const nextFecha = r.fechas && r.fechas[i+1];
    const duracion = (fecha && nextFecha) ? formatDuracion(new Date(nextFecha) - new Date(fecha)) : null;
    const nota = showNotes ? (r.notasEtapa && r.notasEtapa[i]) : null;
    const fieldBadges = (s.fields||[]).map(f=>{
      const v = fieldDisplayValue(r, i, f);
      return v ? `<div class="wp-choice-badge">${f.label}: ${v}</div>` : '';
    }).join('');
    html += `
      <div class="waypoint">
        <div class="wp-rail">
          <div class="wp-dot ${done?'done':''} ${isCurrent?'current':''}">${done?'✓':(i+1)}</div>
          ${i < STAGES.length-1 ? `<div class="wp-connector ${done?'filled':''}"></div>` : ''}
        </div>
        ${duracion && horizontal ? `<div class="wp-duration">⏱ ${duracion}</div>` : ''}
        <div class="wp-body">
          <div class="wp-label ${!done && !isCurrent ? 'future':''}">${s.label}</div>
          ${fecha ? `<div class="wp-date">${formatFecha(fecha)}</div>` : ''}
          ${duracion && !horizontal ? `<div class="wp-duration-inline">⏱ ${duracion} hasta la siguiente etapa</div>` : ''}
          ${fieldBadges}
          ${nota ? `<div class="wp-note-preview">"${nota}"</div>` : ''}
        </div>
      </div>
    `;
  });
  html += '</div>';
  return html;
}

    statusEl.textContent = msg;
    statusEl.className = isError ? 'status-err' : 'status-ok';
    statusEl.style.display = 'block';
  };

  document.getElementById('btnGuardarNueva').onclick = async ()=>{
    const btn = document.getElementById('btnGuardarNueva');
    const cliente = document.getElementById('nvCliente').value.trim();
    const producto = document.getElementById('nvProducto').value;
    const vendedorId = document.getElementById('nvVendedor').value;

    if(!cliente){ showStatus('Falta el nombre del cliente.', true); return; }
    if(!persona){ showStatus('Selecciona un asesor válido.', true); return; }
    if(code !== persona.codigo){ showStatus('Código incorrecto para '+persona.nombre+'.', true); return; }
    if(typeof window.storage === 'undefined'){ showStatus('El almacenamiento no está disponible en esta vista.', true); return; }

        etapaActual: 0,

      if(!ok){ showStatus('No se pudo guardar. Intenta de nuevo.', true); btn.disabled=false; return; }
      showStatus('Venta creada: '+codigo, false);
      await renderAdminHome();
    }catch(err){
      showStatus('Error al guardar: '+(err && err.message ? err.message : String(err)), true);
      btn.disabled = false;
    }
  };
}

// editor de una venta en Administración, con código individual por etapa (por rol)
async function renderVentaEditorAdmin(codigo){
  const key = 'venta:'+codigo;
  const r = ventasCache[key];
  if(!r) return;
  r.campos = r.campos || {};

  let wpHtml = '<div class="flightpath">';
  STAGES.forEach((s, i)=>{
    const done = i < r.etapaActual;
    const isCurrent = i === r.etapaActual;
    const fecha = r.fechas && r.fechas[i];
    const nextFecha = r.fechas && r.fechas[i+1];
    const duracion = (fecha && nextFecha) ? formatDuracion(new Date(nextFecha) - new Date(fecha)) : null;
    const nota = (r.notasEtapa && r.notasEtapa[i]) || '';
    const campos = r.campos[i] || {};
    const requiresCode = !!s.role;
    const unlocked = unlockedStages[i] === true;

    const fieldBadges = (s.fields||[]).map(f=>{
      const v = fieldDisplayValue(r, i, f);
      return v ? `<div class="wp-choice-badge">${f.label}: ${v}</div>` : '';
    }).join('');

    let controlsHtml = '';
    if(!requiresCode || unlocked){
      controlsHtml += `<div class="unlocked-box">`;
      if(unlocked && unlockedNames[i]){
        controlsHtml += `<div class="hint" style="margin:0 0 8px;">Ingresando como: <strong>${unlockedNames[i]}</strong></div>`;
      }
      controlsHtml += `<button class="btn btn-primary btn-sm" data-idx="${i}" data-action="set-stage">Marcar como etapa actual</button>`;

      (s.fields||[]).forEach(f=>{
        const currentVal = campos[f.key];
        if(f.type === 'choice'){
          const opts = f.allowOther ? [...f.options, 'Otro'] : f.options;
          controlsHtml += `<label style="margin-top:8px;">${f.label}</label><div class="wp-choice-row">`;
          controlsHtml += opts.map(opt=>`<button class="choice-btn ${currentVal===opt?'selected':''}" data-idx="${i}" data-fieldkey="${f.key}" data-value="${opt}" data-action="set-field">${opt}</button>`).join('');
          controlsHtml += `</div>`;
          if(f.allowOther && currentVal === 'Otro'){
            const otroVal = campos[f.key+'_otro'] || '';
            controlsHtml += `<input type="text" class="field-otro-input" data-idx="${i}" data-fieldkey="${f.key}" value="${otroVal}" placeholder="Especifica el motivo…" style="margin-top:6px;">`;
          }
        } else if(f.type === 'select'){
          controlsHtml += `<label style="margin-top:8px;">${f.label}</label>
            <select class="field-select-input" data-idx="${i}" data-fieldkey="${f.key}">
              <option value="">Seleccionar…</option>
              ${f.options.map(opt=>`<option value="${opt}" ${currentVal===opt?'selected':''}>${opt}</option>`).join('')}
            </select>`;
        }
      });

      controlsHtml += `<label style="margin-top:8px;">Nota de esta etapa</label>
        <textarea data-idx="${i}" class="note-textarea" placeholder="Escribe una nota...">${nota}</textarea>
        <button class="btn btn-ghost btn-sm" data-idx="${i}" data-action="save-extra" style="margin-top:6px;">Guardar</button>`;
      controlsHtml += `</div>`;
    } else {
      controlsHtml += `
        <div class="lock-row">
          <button class="btn-link" data-idx="${i}" data-action="toggle-lock">🔒 Actualizar (código de ${stageOwnerLabel(s)})</button>
          <div class="lock-inline" data-idx="${i}" style="display:none;">
            <input type="password" data-idx="${i}" class="code-input" placeholder="Código">
            <button class="btn btn-primary btn-sm" data-idx="${i}" data-action="verify-code">Verificar</button>
          </div>
          <div class="code-error" data-idx="${i}"></div>
        </div>
      `;
    }

    wpHtml += `
      <div class="waypoint">
        <div class="wp-rail">
          <div class="wp-dot ${done?'done':''} ${isCurrent?'current':''}">${done?'✓':(i+1)}</div>
          ${i < STAGES.length-1 ? `<div class="wp-connector ${done?'filled':''}"></div>` : ''}
        </div>
        <div class="wp-body">
          <div class="wp-label ${!done && !isCurrent ? 'future':''}">${s.label}</div>
          ${stageOwnerLabel(s) ? `<div class="wp-owner">Responsable: ${stageOwnerLabel(s)}</div>` : ''}
          ${fecha ? `<div class="wp-date">${formatFecha(fecha)}</div>` : ''}
          ${duracion ? `<div class="wp-duration-inline">⏱ ${duracion} hasta la siguiente etapa</div>` : ''}
          ${fieldBadges}
          ${nota ? `<div class="wp-note-preview">"${nota}"</div>` : ''}
          ${controlsHtml}
        </div>
      </div>
    `;
  });
  wpHtml += '</div>';

  const ventaCompletada = r.etapaActual === STAGES.length - 1;

  viewAdmin.innerHTML = `
    <div class="panel">
      <h2>${r.cliente}</h2>
      <p class="hint mono">${codigo} · ${r.producto} · Asesor: ${r.vendedor}</p>
      <button class="btn btn-ghost btn-sm" id="btnLinkCliente">Generar link para el cliente</button>
      <div id="linkClienteBox"></div>
      ${wpHtml}
      <div class="close-row" style="justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <button class="btn btn-ghost btn-sm" id="btnVolverAdmin">← Volver a la lista</button>
        ${ventaCompletada ? `<button class="btn btn-danger btn-sm" id="btnEliminarVenta">Eliminar venta</button>` : ''}
      </div>
    </div>
  `;

  document.getElementById('btnVolverAdmin').onclick = renderAdminHome;
  if(ventaCompletada){
    const btnEliminar = document.getElementById('btnEliminarVenta');
    btnEliminar.onclick = async ()=>{
      if(btnEliminar.textContent !== '¿Confirmar eliminación?'){
        btnEliminar.textContent = '¿Confirmar eliminación?';
        return;
      }
      btnEliminar.disabled = true;
      btnEliminar.textContent = 'Eliminando…';
      await deleteVenta(codigo);
      await renderAdminHome();
    };
  }
  document.getElementById('btnLinkCliente').onclick = ()=>{
    const url = buildLink('codigo', codigo);
    document.getElementById('linkClienteBox').innerHTML =
      `<input type="text" readonly value="${url}" class="mono" style="margin-top:8px;" onclick="this.select()">
       <p class="hint" style="margin:4px 0 0;">Toca el campo y copia (Ctrl+C / Cmd+C). Este link muestra solo esta venta, sin buscador ni otras pestañas.</p>`;
  };

  viewAdmin.querySelectorAll('[data-action="toggle-lock"]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = btn.dataset.idx;
      const box = viewAdmin.querySelector(`.lock-inline[data-idx="${idx}"]`);
      box.style.display = box.style.display === 'none' ? 'flex' : 'none';
    };
  });

  viewAdmin.querySelectorAll('[data-action="verify-code"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const s = STAGES[idx];
      const input = viewAdmin.querySelector(`.code-input[data-idx="${idx}"]`);
      const errBox = viewAdmin.querySelector(`.code-error[data-idx="${idx}"]`);
      const val = input.value.trim();
      const person = findPersonByRoleAndCode(s.role, val);
      if(person){
        unlockedStages[idx] = true;
        unlockedNames[idx] = person.nombre;

        // Autocompleta el campo "select" de identidad (ej. técnico/tienda) con quien ingresó el código,
        // sin necesidad de elegirlo de nuevo en la lista.
        const selectField = (s.fields||[]).find(f => f.type === 'select' && f.options.includes(person.nombre));
        if(selectField){
          r.campos = r.campos || {};
          r.campos[idx] = r.campos[idx] || {};
          r.campos[idx][selectField.key] = person.nombre;
          await saveVenta(codigo, r);
          ventasCache[key] = r;
        }

        renderVentaEditorAdmin(codigo);
      }else{
        errBox.innerHTML = `<div class="error-box">Código incorrecto.</div>`;
      }
    };
  });

  viewAdmin.querySelectorAll('[data-action="set-stage"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      r.etapaActual = idx;
      r.fechas = r.fechas || {};
      if(!r.fechas[idx]) r.fechas[idx] = new Date().toISOString();
      await saveVenta(codigo, r);
      ventasCache[key] = r;
      renderVentaEditorAdmin(codigo);
    };
  });

  viewAdmin.querySelectorAll('[data-action="set-field"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const fk = btn.dataset.fieldkey;
      const val = btn.dataset.value;
      r.campos = r.campos || {};
      r.campos[idx] = r.campos[idx] || {};
      const current = r.campos[idx][fk];
      r.campos[idx][fk] = (current === val) ? null : val;
      if(r.campos[idx][fk] !== 'Otro'){ delete r.campos[idx][fk+'_otro']; }
      await saveVenta(codigo, r);
      ventasCache[key] = r;
      renderVentaEditorAdmin(codigo);
    };
  });

  viewAdmin.querySelectorAll('[data-action="save-extra"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const ta = viewAdmin.querySelector(`.note-textarea[data-idx="${idx}"]`);
      r.notasEtapa = r.notasEtapa || {};
      r.notasEtapa[idx] = ta.value.trim();

      r.campos = r.campos || {};
      r.campos[idx] = r.campos[idx] || {};
      viewAdmin.querySelectorAll(`.field-select-input[data-idx="${idx}"]`).forEach(sel=>{
        r.campos[idx][sel.dataset.fieldkey] = sel.value || null;
      });
      viewAdmin.querySelectorAll(`.field-otro-input[data-idx="${idx}"]`).forEach(inp=>{
        r.campos[idx][inp.dataset.fieldkey+'_otro'] = inp.value.trim();
      });

      btn.textContent = 'Guardando…';
      await saveVenta(codigo, r);
      ventasCache[key] = r;
      renderVentaEditorAdmin(codigo);
    };
  });
}

// ---------- CONFIGURACIÓN (gestión de personal y códigos) ----------
function renderConfigGate(){
  if(configUnlocked){ renderConfigHome(); return; }
  viewConfig.innerHTML = `
    <div class="panel">
      <h2>Acceso a Configuración</h2>
      <p class="hint">Este acceso es distinto al de Administración. Ingresa el código de configuración.</p>
      <input type="password" id="configPin" placeholder="Código de configuración">
      <div id="configGateError" class="error-box" style="display:none;"></div>
      <button class="btn btn-primary btn-full" id="btnConfigLogin">Ingresar</button>
    </div>
  `;
  document.getElementById('btnConfigLogin').onclick = ()=>{
    const val = document.getElementById('configPin').value.trim();
    if(val === CONFIG_CODE){
      configUnlocked = true;
      renderConfigHome();
    }else{
      const err = document.getElementById('configGateError');
      err.textContent = 'Código incorrecto.';
      err.style.display = 'block';
    }
  };
  document.getElementById('configPin').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ document.getElementById('btnConfigLogin').click(); }
  });
}

async function renderConfigHome(){
  viewConfig.innerHTML = `<div class="panel"><p class="hint" style="margin:0;">Cargando…</p></div>`;
  await loadSystemCodes();
  await loadPersonal();

  const allPeople = [];
  ROLES.forEach(rol=>{
    personalByRole(rol).forEach(p=> allPeople.push(p));
  });

  let tableHtml = '';
  if(allPeople.length === 0){
    tableHtml = `<div class="empty-state">Aún no hay personal registrado.</div>`;
  }else{
    tableHtml = `
      <table class="codes-table">
        <thead>
          <tr><th>Rol</th><th>Nombre</th><th>Código</th><th></th></tr>
        </thead>
        <tbody id="codesTableBody">
          ${allPeople.map(p=>`
            <tr data-row-id="${p.id}">
              <td class="role-chip">${p.rol}</td>
              <td class="person-name">${p.nombre}</td>
              <td><span class="code-chip">${p.codigo}</span></td>
              <td>
                <div class="person-actions">
                  <button class="btn btn-ghost btn-sm" data-id="${p.id}" data-action="edit-person">Editar</button>
                  <button class="btn btn-danger btn-sm" data-id="${p.id}" data-action="delete-person">Eliminar</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  viewConfig.innerHTML = `
    <div class="panel">
      <h2>Códigos generales del sistema</h2>
      <p class="hint">Acceso de Personal Canex (Administración) y acceso de esta pantalla de Configuración.</p>
      <label>Código de Personal Canex</label>
      <input type="text" id="sysCollab" class="mono" value="${COLLAB_CODE}">
      <label>Código de Configuración</label>
      <input type="text" id="sysConfig" class="mono" value="${CONFIG_CODE}">
      <div id="sysStatus" style="display:none;"></div>
      <button class="btn btn-primary btn-full" id="btnSysGuardar">Guardar códigos generales</button>
    </div>

    <div class="panel">
      <h2>Agregar vendedor o integrante</h2>
      <p class="hint">Crea un nuevo Vendedor, Coordinadora, Entregador, Bodeguero, o cualquier otro rol con su propio código.</p>
      <label>Nombre completo</label>
      <input type="text" id="cfgNombre" placeholder="Ej. María Pérez">
      <label>Rol</label>
      <select id="cfgRol">
        ${ROLES.map(r=>`<option value="${r}">${r}</option>`).join('')}
      </select>
      <label>Código de acceso</label>
      <input type="text" id="cfgCodigo" class="mono" placeholder="Ej. 458210">
      <div id="cfgStatus" style="display:none;"></div>
      <button class="btn btn-primary btn-full" id="btnCfgGuardar">Agregar persona</button>
    </div>

    <div class="panel">
      <h2>Todos los códigos (${allPeople.length})</h2>
      <p class="hint">Incluye Gerencia, Comité y Técnico. Toca "Editar" para cambiar nombre, rol o código.</p>
      ${tableHtml}
    </div>
  `;

  // ---- códigos generales ----
  const sysStatus = document.getElementById('sysStatus');
  document.getElementById('btnSysGuardar').onclick = async ()=>{
    const collab = document.getElementById('sysCollab').value.trim();
    const config = document.getElementById('sysConfig').value.trim();
    if(!collab || !config){
      sysStatus.textContent = 'Ambos códigos son obligatorios.';
      sysStatus.className = 'status-err'; sysStatus.style.display='block';
      return;
    }
    const ok = await saveSystemCodes(collab, config);
    sysStatus.textContent = ok ? 'Códigos generales actualizados.' : 'No se pudo guardar.';
    sysStatus.className = ok ? 'status-ok' : 'status-err';
    sysStatus.style.display = 'block';
  };

  // ---- agregar persona ----
  const cfgStatus = document.getElementById('cfgStatus');
  const showCfgStatus = (msg, isError)=>{
    cfgStatus.textContent = msg;
    cfgStatus.className = isError ? 'status-err' : 'status-ok';
    cfgStatus.style.display = 'block';
  };
  document.getElementById('btnCfgGuardar').onclick = async ()=>{
    const nombre = document.getElementById('cfgNombre').value.trim();
    const rol = document.getElementById('cfgRol').value;
    const codigo = document.getElementById('cfgCodigo').value.trim();
    if(!nombre){ showCfgStatus('Falta el nombre.', true); return; }
    if(!codigo){ showCfgStatus('Falta el código.', true); return; }
    const dup = Object.values(personalCache).find(p=>p.rol===rol && p.codigo===codigo);
    if(dup){ showCfgStatus('Ese código ya está en uso para ese rol.', true); return; }

    const id = 'personal:' + rol.toLowerCase().replace(/\s+/g,'-') + '-' + Date.now() + '-' + Math.floor(Math.random()*1000);
    showCfgStatus('Guardando…', false);
    const ok = await savePersonal(id, { nombre, rol, codigo, creado:new Date().toISOString() });
    if(!ok){ showCfgStatus('No se pudo guardar. Intenta de nuevo.', true); return; }
    await renderConfigHome();
  };

  // ---- eliminar persona ----
  viewConfig.querySelectorAll('[data-action="delete-person"]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(btn.textContent !== '¿Confirmar?'){
        btn.textContent = '¿Confirmar?';
        return;
      }
      await deletePersonal(btn.dataset.id);
      await renderConfigHome();
    };
  });

  // ---- editar persona ----
  viewConfig.querySelectorAll('[data-action="edit-person"]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      const p = personalCache[id];
      if(!p) return;
      const row = viewConfig.querySelector(`tr[data-row-id="${id}"]`);
      row.innerHTML = `
        <td colspan="4">
          <div style="padding:10px 0;">
            <label style="margin-top:0;">Nombre</label>
            <input type="text" class="edit-nombre" value="${p.nombre}">
            <label>Rol</label>
            <select class="edit-rol">
              ${ROLES.map(r=>`<option value="${r}" ${r===p.rol?'selected':''}>${r}</option>`).join('')}
            </select>
            <label>Código</label>
            <input type="text" class="edit-codigo mono" value="${p.codigo}">
            <div class="edit-status" style="display:none;"></div>
            <div style="display:flex; gap:8px; margin-top:10px;">
              <button class="btn btn-primary btn-sm" data-action="save-edit" data-id="${id}">Guardar cambios</button>
              <button class="btn btn-ghost btn-sm" data-action="cancel-edit">Cancelar</button>
            </div>
          </div>
        </td>
      `;
      row.querySelector('[data-action="cancel-edit"]').onclick = renderConfigHome;
      row.querySelector('[data-action="save-edit"]').onclick = async ()=>{
        const nombre = row.querySelector('.edit-nombre').value.trim();
        const rol = row.querySelector('.edit-rol').value;
        const codigo = row.querySelector('.edit-codigo').value.trim();
        const statusEl = row.querySelector('.edit-status');
        if(!nombre || !codigo){
          statusEl.textContent = 'Nombre y código son obligatorios.';
          statusEl.className = 'status-err'; statusEl.style.display = 'block';
          return;
        }
        const ok = await savePersonal(id, { nombre, rol, codigo, creado:p.creado||new Date().toISOString() });
        if(!ok){
          statusEl.textContent = 'No se pudo guardar.';
          statusEl.className = 'status-err'; statusEl.style.display = 'block';
          return;
        }
        await renderConfigHome();
      };
    };
  });
}

// ---------- VENDEDOR (identidad ya establecida en el login) ----------
function renderVendedorList(){
  const container = document.getElementById('vendedorContent');
  const mine = Object.entries(ventasCache).filter(([k,r]) => r.vendedor === currentVendedor)
    .sort((a,b)=> (b[1].creado||'').localeCompare(a[1].creado||''));

  let html = `
    <div class="panel">
      <h2>Ventas de ${currentVendedor}</h2>
      <button class="btn btn-ghost" id="btnNuevaVentaVend">+ Registrar nueva venta</button>
      <button class="btn-link" id="btnVendedorCambiar" style="display:block; margin-top:12px;">← Cambiar de perfil</button>
    </div>
  `;

  if(mine.length === 0){
    html += `<div class="panel"><div class="empty-state">No tienes ventas registradas todavía.</div></div>`;
  }else{
    html += `<div class="panel" style="padding:10px 16px;">`;
    mine.forEach(([key, r])=>{
      const codigo = key.replace('venta:','');
      html += `
        <div class="sale-card" data-codigo="${codigo}">
          <div class="sale-top">
            <div>
              <div class="sale-client">${r.cliente}</div>
              <div class="sale-product">${r.producto} · <span class="mono sale-code">${codigo}</span></div>
            </div>
            ${stageBadge(r.etapaActual)}
          </div>
          ${miniTrack(r.etapaActual)}
        </div>
      `;
    });
    html += `</div>`;
  }

  container.innerHTML = html;
  document.getElementById('btnNuevaVentaVend').onclick = openNuevaVentaFormVendedor;
  document.getElementById('btnVendedorCambiar').onclick = showLanding;
  container.querySelectorAll('.sale-card').forEach(card=>{
    card.onclick = ()=> renderVendedorDetail(card.dataset.codigo);
  });
}

function openNuevaVentaFormVendedor(){
  const container = document.getElementById('vendedorContent');
  const productOptions = PRODUCTOS.map(p=>`<option value="${p}">${p}</option>`).join('');
  container.insertAdjacentHTML('afterbegin', `
    <div class="panel" id="nuevaVentaPanelVend">
      <h2>Nueva venta · ${currentVendedor}</h2>
      <label>Nombre del cliente</label>
      <input type="text" id="nvvCliente" placeholder="Ej. Agrícola San José S.A.">
      <label>Producto</label>
      <select id="nvvProducto">${productOptions}</select>
      <label>Tu código de asesor</label>
      <input type="password" id="nvvCode" placeholder="Código">
      <div id="nvvStatus" style="display:none;"></div>
      <button class="btn btn-primary btn-full" id="btnGuardarNuevaVend">Crear venta</button>
      <div class="close-row"><button class="btn btn-ghost btn-sm" id="btnCancelarNuevaVend">Cancelar</button></div>
    </div>
  `);
  document.getElementById('btnCancelarNuevaVend').onclick = ()=> document.getElementById('nuevaVentaPanelVend').remove();

  const statusEl = document.getElementById('nvvStatus');
  const showStatus = (msg, isError)=>{
    statusEl.textContent = msg;
    statusEl.className = isError ? 'status-err' : 'status-ok';
    statusEl.style.display = 'block';
  };

  document.getElementById('btnGuardarNuevaVend').onclick = async ()=>{
    const btn = document.getElementById('btnGuardarNuevaVend');
    const cliente = document.getElementById('nvvCliente').value.trim();
    const producto = document.getElementById('nvvProducto').value;
    const code = document.getElementById('nvvCode').value.trim();

    if(!cliente){ showStatus('Falta el nombre del cliente.', true); return; }
    if(code !== currentVendedorCode){ showStatus('Código incorrecto.', true); return; }
    if(typeof window.storage === 'undefined'){ showStatus('El almacenamiento no está disponible en esta vista.', true); return; }

    btn.disabled = true;
    showStatus('Guardando…', false);
    try{
      const listRes = await window.storage.list('venta:', true);
      const existingKeys = (listRes && listRes.keys) ? listRes.keys : [];
      const codigo = generateCodigo(existingKeys);
      const record = {
        cliente, producto, vendedor: currentVendedor,
        etapaActual: 0,
        fechas: { 0: new Date().toISOString() },
        notasEtapa: {},
        campos: {},
        creado: new Date().toISOString()
      };
      const ok = await saveVenta(codigo, record);
      if(!ok){ showStatus('No se pudo guardar. Intenta de nuevo.', true); btn.disabled=false; return; }
      showStatus('Venta creada: '+codigo, false);
      await loadAllVentas();
      renderVendedorList();
    }catch(err){
      showStatus('Error al guardar: '+(err && err.message ? err.message : String(err)), true);
      btn.disabled = false;
    }
  };
}

function renderVendedorDetail(codigo){
  const key = 'venta:'+codigo;
  const r = ventasCache[key];
  if(!r) return;
  const container = document.getElementById('vendedorContent');
  container.innerHTML = `
    <div class="panel">
      <h2>${r.cliente}</h2>
      <p class="hint mono">${codigo} · ${r.producto}</p>
      ${buildFlightpathReadOnly(r)}
      <div class="close-row"><button class="btn btn-ghost btn-sm" id="btnVolverVend">← Volver a mis ventas</button></div>
    </div>
  `;
  document.getElementById('btnVolverVend').onclick = renderVendedorList;
}

// ---------- CLIENTE (solo lectura) ----------
async function fetchVenta(raw){
  const key = 'venta:'+raw;
  try{
    const res = await window.storage.get(key, true);
    if(!res || !res.value) return null;
    return JSON.parse(res.value);
  }catch(e){
    return null;
  }
}

  { emoji:'📝', text:'Estamos afinando los últimos detalles de tu compra.' },
  { emoji:'✅', text:'Tu pedido está en revisión final de gerencia.' },
  { emoji:'💳', text:'Estamos confirmando la forma de pago de tu compra.' },
  { emoji:'📦', text:'Estamos verificando la disponibilidad de tu Agras.' },
  { emoji:'🧾', text:'Estamos generando la factura de tu equipo.' },
  { emoji:'🔧', text:'Tu dron está siendo calibrado y preparado por nuestro equipo técnico.' },
  { emoji:'💰', text:'Estamos confirmando la recepción de tu pago.' },
  { emoji:'🚚', text:'¡Tu Agras está lista y a punto de salir de bodega!' },
  { emoji:'🛫', text:'¡Tu dron ya va en camino hacia ti!' },
  { emoji:'🎉', text:'¡Tu Agras ya está en tus manos! Bienvenido a la familia Canex.' },
  { emoji:'🎉', text:'¡Todo listo! Tu compra quedó completamente cerrada.' }
];
function renderClienteResult(raw, r){
  const idx = r.etapaActual;
  const total = STAGES.length - 1;
  const pct = Math.round((idx / total) * 100);
  const delivered = idx === STAGES.length - 1;
  const copy = CLIENT_STAGE_COPY[idx] || { emoji:'🚁', text:STAGES[idx].label };

  document.getElementById('clienteResultado').innerHTML = `
    <div class="client-hero ${delivered ? 'hero-delivered' : ''}">
      <div class="drone-emoji">🚁</div>
      <div class="hero-client">${r.cliente}</div>
      <div class="hero-product">${r.producto}</div>
      <div class="hero-stage">${copy.emoji} ${copy.text}</div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%;"></div></div>
      <div class="progress-pct">${pct}% del proceso completado</div>
    </div>
    <div class="panel" style="margin-top:14px;">
      <div class="info-grid" style="margin-top:0;">
        <div><div class="k">Código</div><div class="v mono">${raw}</div></div>
        <div><div class="k">Producto</div><div class="v">${r.producto}</div></div>
        <div><div class="k">Asesor</div><div class="v">${r.vendedor}</div></div>
        <div><div class="k">Etapa actual</div><div class="v">${STAGES[idx].label}</div></div>
      </div>
      ${buildFlightpathReadOnly(r, false, true)}
    </div>
  `;
}
async function loadClienteByCode(raw){
  const r = await fetchVenta(raw);
  if(!r){
    document.getElementById('clienteResultado').innerHTML =
      `<div class="panel"><div class="error-box" style="margin-top:0;">No encontramos ese código. Verifica con tu asesor comercial.</div></div>`;
    return;
  }
  renderClienteResult(raw, r);
}

// ---------- Links directos ----------
function buildLink(param, value){
  return `${window.location.origin}${window.location.pathname}?${param}=${encodeURIComponent(value)}`;
}

// ---------- arranque ----------
(async function init(){
  await seedPersonalIfEmpty();
  await seedTecnicosIfMissing();
  await seedEntregadoresIfMissing();
  await loadSystemCodes();
  await loadPersonal();

  const urlParams = new URLSearchParams(window.location.search);
  const lockedCodigo = urlParams.get('codigo');
  const lockedVendedor = urlParams.get('vendedor');

  if(lockedCodigo){
    hideAllViews();
    modeToggle.style.display = 'none';
    viewCliente.style.display = 'block';
    document.getElementById('btnClienteVolver').style.display = 'none';
    loadClienteByCode(lockedCodigo.toUpperCase());
  }else if(lockedVendedor){
    hideAllViews();
    modeToggle.style.display = 'none';
    viewVendedor.style.display = 'block';
    currentVendedor = decodeURIComponent(lockedVendedor);
    const person = personalByRole('Vendedor').find(p=>p.nombre === currentVendedor);
    currentVendedorCode = person ? person.codigo : null;
    await loadAllVentas();
    renderVendedorList();
  }else{
    showLanding();
  }
})();
</script>
